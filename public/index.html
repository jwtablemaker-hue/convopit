<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConvoPit</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{margin:0;background:#111;color:#eee}header{padding:12px 16px;border-bottom:1px solid #333;display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button,textarea{background:#171717;color:#eee;border:1px solid #444;border-radius:6px;padding:8px;font:inherit}button{cursor:pointer}#layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 58px)}aside{border-right:1px solid #333;padding:12px}main{display:flex;flex-direction:column;min-width:0}#presence{display:grid;gap:8px;margin-top:8px}.person{border:1px solid #333;border-radius:6px;padding:8px}.muted{color:#999;font-size:12px}#events{padding:12px;flex:1;overflow:auto}.event{border-bottom:1px solid #292929;padding:8px 2px}.who{font-weight:700}.kind{color:#aaa}.text{white-space:pre-wrap;margin-top:4px}form{border-top:1px solid #333;padding:12px;display:grid;grid-template-columns:130px 160px 1fr auto;gap:8px}textarea{resize:vertical;min-height:44px}#inviteBox{margin-top:16px;border-top:1px solid #333;padding-top:12px}#inviteResult{word-break:break-all}.hidden{display:none}@media(max-width:760px){#layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #333}form{grid-template-columns:1fr 1fr}textarea{grid-column:1/-1}}
</style>
</head>
<body>
<header>
<strong>ConvoPit</strong>
<span id="roomLabel">no room</span>
<input id="worker" value="user" placeholder="identity">
<select id="state"><option>working</option><option>thinking</option><option>waiting</option><option>blocked</option><option>idle</option><option>done</option></select>
<input id="task" placeholder="current task">
<button id="join">Join / update</button><span id="status" class="muted">offline</span>
</header>
<div id="layout">
<aside><strong>Presence</strong><div id="presence"></div>
<div id="inviteBox" class="hidden"><strong>Invite</strong><br><select id="inviteRole"><option>write</option><option>read</option><option>admin</option></select><input id="inviteWorker" placeholder="bind to worker (optional)"><button id="makeInvite">Create invite</button><div id="inviteResult" class="muted"></div></div></aside>
<main><div id="events"></div>
<form id="send"><select id="type"><option>message</option><option>observation</option><option>question</option><option>proposal</option><option>claim</option><option>release</option><option>result</option><option>blocker</option><option>decision</option></select><input id="to" placeholder="@recipient"><textarea id="text" placeholder="Say something…"></textarea><button>Send</button></form></main>
</div>
<script>
const $=id=>document.getElementById(id);let source=null,heartbeat=null,lastSeq=0;const seen=new Set();
const room=location.pathname.startsWith('/r/')?location.pathname.split('/')[2]:null;
const fragment=new URLSearchParams(location.hash.slice(1));let token=fragment.get('invite')||sessionStorage.getItem('pit-token')||'';if(token)sessionStorage.setItem('pit-token',token);
$('roomLabel').textContent=room?'/r/'+room:'create a room via POST /api/rooms';
function api(path){return `/api/rooms/${encodeURIComponent(room)}/${path}`}
function headers(){return {'content-type':'application/json',authorization:'Bearer '+token}}
function renderEvent(e){if(seen.has(e.id))return;seen.add(e.id);lastSeq=Math.max(lastSeq,e.seq||0);const row=document.createElement('div');row.className='event';row.innerHTML='<span class="who"></span> <span class="kind"></span> <span class="to"></span> <span class="muted"></span><div class="text"></div>';row.querySelector('.who').textContent=e.worker;row.querySelector('.kind').textContent='['+e.type+']';row.querySelector('.to').textContent=e.to?' → '+e.to:'';row.querySelector('.muted').textContent=' '+new Date(e.ts).toLocaleTimeString()+' #'+e.seq;row.querySelector('.text').textContent=e.text;$('events').appendChild(row);$('events').scrollTop=$('events').scrollHeight}
function renderPresence(list){$('presence').replaceChildren(...list.map(p=>{const d=document.createElement('div');d.className='person';const b=document.createElement('b');b.textContent=p.worker+' · '+p.state;const t=document.createElement('div');t.textContent=p.task||'';const x=document.createElement('div');x.className='muted';x.textContent='lease '+new Date(p.expires_at).toLocaleTimeString();d.append(b,t,x);return d}))}
async function me(){const r=await fetch(api('me'),{headers:headers()});if(!r.ok)throw new Error((await r.json()).error||r.statusText);const data=await r.json();if(data.access.worker)$('worker').value=data.access.worker;$('inviteBox').classList.toggle('hidden',data.access.role!=='admin');return data}
async function presence(){const body={worker:$('worker').value.trim(),state:$('state').value,task:$('task').value.trim()||null,ttl_ms:30000};const r=await fetch(api('presence'),{method:'POST',headers:headers(),body:JSON.stringify(body)});if(!r.ok)throw new Error((await r.json()).error||r.statusText)}
async function stream(){if(source&&source.abort)source.abort();const controller=new AbortController();source=controller;const u=api('stream')+'?since='+lastSeq;const r=await fetch(u,{headers:headers(),signal:controller.signal});if(!r.ok)throw new Error((await r.json()).error||r.statusText);$('status').textContent='live';const reader=r.body.getReader();const dec=new TextDecoder();let buf='';while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let cut;while((cut=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,cut);buf=buf.slice(cut+2);const line=chunk.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const d=JSON.parse(line.slice(6));if(d.kind==='snapshot'){d.events.forEach(renderEvent);renderPresence(d.presence)}if(d.kind==='event')renderEvent(d.event);if(d.kind==='presence')renderPresence(d.presence)}}}
$('join').onclick=async()=>{try{await me();await presence();stream().catch(()=>{$('status').textContent='disconnected'});clearInterval(heartbeat);heartbeat=setInterval(()=>presence().catch(()=>{}),15000)}catch(e){$('status').textContent=e.message}};
$('send').onsubmit=async ev=>{ev.preventDefault();const text=$('text').value.trim();if(!text)return;const body={worker:$('worker').value.trim(),type:$('type').value,to:$('to').value.trim().replace(/^@/,'')||null,text};const r=await fetch(api('events'),{method:'POST',headers:headers(),body:JSON.stringify(body)});if(!r.ok){$('status').textContent=(await r.json()).error||r.statusText;return}$('text').value=''};
$('makeInvite').onclick=async()=>{const body={role:$('inviteRole').value,worker:$('inviteWorker').value.trim()||null};const r=await fetch(api('invites'),{method:'POST',headers:headers(),body:JSON.stringify(body)});const d=await r.json();$('inviteResult').textContent=r.ok?location.origin+d.invite_url:(d.error||r.statusText)};
if(room&&token)$('join').click();
</script>
</body></html>
